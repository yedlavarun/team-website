<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="stylesheet.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cardio Wars</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&display=swap"
        rel="stylesheet" />

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="script.js" defer></script>
</head>

<body>
    <!-- Map Container -->
    <div id="map"></div>

    <!-- HUD Overlay Layer -->
    <div id="hud_layer">

        <!-- Floating Stats Panel -->
        <div class="stats-panel hud-element">
            <div class="stat-item">
                <div class="stat-value" id="timer">00:00</div>
                <div class="stat-label">Time</div>
            </div>
            <div class="stat-item">
                <div class="stat-value"><span id="distance">0.00</span></div>
                <div class="stat-label">Km</div>
            </div>
            <div class="stat-item">
                <div class="stat-value"><span id="speed">0.0</span></div>
                <div class="stat-label">Km/h</div>
            </div>
        </div>


        <!-- Top Left: Team & Status -->
        <div class="top-bar hud-element">
            <div class="team-badge">
                <div class="team-name">Cardio Wars</div>
            </div>

            <div class="status-indicators">
                <div class="status-dot active" title="Online"></div>
                <div class="status-dot active" title="GPS Locked"></div>
            </div>
        </div>

        <!-- Floating Map Actions (Right Side) -->
        <div class="map-actions hud-element">
            <div class="fab" onclick="centerMap()" title="Center Map">📍</div>
            <div class="fab" onclick="showLeaderboard()" title="Leaderboard">🏆</div>
            <a class="fab" href="dashboard.html" title="My Dashboard" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">📊</a>
        </div>

        <!-- Bottom Controls -->
        <div class="bottom-controls hud-element">
            <!-- Main Button -->
            <button id="mainBtn" class="btn-game" onclick="toggleTracking()">
                Start Run
            </button>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- SUMMARY SCREEN (Hidden by default) -->
    <div id="summary-screen" class="screen hidden">
        <div class="screen-header">
            <div class="screen-title">Run Summary</div>
        </div>

        <div class="summary-card">
            <div class="metric_grid" style="margin-top:20px;">
                <div class="metric_item">
                    <div class="metric_value" id="sum-dist">0.0</div>
                    <div class="metric_label">Distance</div>
                </div>
                <div class="metric_item">
                    <div class="metric_value" id="sum-time">00:00</div>
                    <div class="metric_label">Duration</div>
                </div>
            </div>
        </div>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
            <button class="btn-game" id="save-run-btn" onclick="saveRunToDashboard()" style="background: linear-gradient(135deg,#6366f1,#8b5cf6);">💾 Save Run to Dashboard</button>
            <button class="btn-game" onclick="hideSummary()">Close</button>
        </div>
        <div id="save-run-msg" style="text-align:center;font-size:12px;margin-top:8px;color:#22d3ee;"></div>
    </div>

</body>

</html>
